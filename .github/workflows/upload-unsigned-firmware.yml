# Builds the factory firmware and uploads the unsigned, sector-padded APP
# image plus a build-info.json manifest to the Autograph unsigned bucket via
# Workload Identity Federation. Signing is a human action in the Autograph
# dashboard; after approval, publish-signed-firmware.yml assembles the factory
# image around the signed app and publishes it to firmware.nabucasa.com.
#
# Environment routing: pushes to dev (and manual dispatches) build for
# STAGING; pushing a CalVer version tag (e.g. 2026.9.0) builds for
# PRODUCTION. The environment decides the Autograph instance
# (project/bucket/WIF) and the firmware.nabucasa.com channel manifest baked
# into the compiled update component (FW_CHANNEL_MANIFEST) — prod and
# staging firmware trust different signing keys and must never mix channels.
#
# This workflow publishes nothing: signing and publishing happen after
# human approval, and nothing built here is signed yet.
#
# Authentication is entirely via the repository's OIDC token — no GitHub
# secrets are configured for this workflow. Adapted from NabuCasa/aux-2.

name: Build & upload unsigned firmware

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "[0-9]*"

# OIDC token minting requires id-token: write; everything else stays
# read-only.
permissions:
  contents: read
  id-token: write

concurrency:
  group: fw-upload-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG: home-assistant-voice.factory.yaml
  # Autograph target id and bucket prefix — must be registered in the signing
  # dashboard and is permanent once firmware ships. Set explicitly because the
  # config basename carries the .factory suffix.
  TARGET: home-assistant-voice
  ESPHOME_VERSION: 2026.9.0
  # Target block for the manifest — must match the KMS key config in the
  # signing dashboard.
  CHIP: esp32s3
  SIGN_SCHEME: rsa-pss-3072-sha256
  # Environment-routed values: version tags go to the production Autograph
  # instance, everything else to staging. Values live in repo-level Actions
  # variables (FW_STAGING_* / FW_PROD_*). Deliberately NOT GitHub
  # Environments: attaching `environment:` to a job changes the OIDC token's
  # subject claim from ref-based to environment-based, which the
  # ref-restricted WIF providers (prod: tags only) would reject.
  FW_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
  PROJECT_ID: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_PROJECT_ID || vars.FW_STAGING_PROJECT_ID }}
  BUCKET: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_UNSIGNED_BUCKET || vars.FW_STAGING_UNSIGNED_BUCKET }}
  WIF_PROVIDER: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_WIF_PROVIDER || vars.FW_STAGING_WIF_PROVIDER }}
  # The firmware's OTA trust anchor is derived at build time from the signing
  # keys' public halves: each is fetched from KMS, verified against the
  # DER-SHA256 pin below, then reduced to its Secure Boot v2 block-format digest
  # and compiled in. So nothing but the (git-reviewed) fingerprint pins lives in
  # the repo, and a key rotation flows in from KMS with no variable to update.
  # These mirror the pins in publish-signed-firmware.yml; prod and staging sign
  # with different keys. GCP fetch needs roles/cloudkms.publicKeyViewer; AWS
  # fetch assumes an OIDC role with kms:GetPublicKey only — both must admit this
  # workflow's token (ref-based subject: dev for staging, the tag for prod).
  KMS_LOCATION: europe-west1
  KMS_KEYRING: firmware-signing
  KMS_KEY: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_KMS_KEY || vars.FW_STAGING_KMS_KEY }}
  KMS_KEY_VERSION: "1"
  GCP_PUBKEY_DER_SHA256: ${{ startsWith(github.ref, 'refs/tags/') && '755f3b1e43d3d5543e40bd3754b45c9047e2ab2654e7dd1e63cb4c7ccf083b7c' || '972162fb3078c14783e886ab637414cdc0517d4fa9fd4fc5224485fb92803fde' }}
  AWS_REGION: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_AWS_REGION || vars.FW_STAGING_AWS_REGION }}
  AWS_ROLE_ARN: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_AWS_ROLE_ARN || vars.FW_STAGING_AWS_ROLE_ARN }}
  AWS_KMS_KEY_ARN: ${{ startsWith(github.ref, 'refs/tags/') && vars.FW_PROD_AWS_KMS_KEY_ARN || vars.FW_STAGING_AWS_KMS_KEY_ARN }}
  AWS_PUBKEY_DER_SHA256: ${{ startsWith(github.ref, 'refs/tags/') && 'c668c69eea348f946e47570e83e32ad5df3725e2c670de137e6101fcb5007247' || '72131bf92d25a0e5552b433ee6b00368f110fe7127db47b3a1073dccdf64bcfb' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Check environment configuration
        shell: bash
        run: |
          set -euo pipefail
          # Repo-level Actions variables are invisible to PR review — fail
          # loudly if any are unset rather than proceeding with empty values.
          for v in PROJECT_ID BUCKET WIF_PROVIDER KMS_KEY AWS_REGION AWS_ROLE_ARN AWS_KMS_KEY_ARN; do
            if [ -z "${!v}" ]; then
              echo "Missing repo Actions variable for ${FW_ENV} ${v} (FW_$(echo "${FW_ENV}" | tr a-z A-Z)_…)" >&2
              exit 1
            fi
          done

      - name: Compute firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Production: the tag IS the version (bare CalVer, e.g.
            # 2026.9.0). Tolerate an accidental v prefix by stripping it.
            version="${GITHUB_REF_NAME#v}"
          else
            # Staging: date-based CalVer with the run number.
            commit_date="$(git show -s --format=%cs HEAD)"
            version="${commit_date//-/.}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version (${FW_ENV})"

      # Authenticate early: the same GCP credentials fetch the signing key's
      # public half below and upload the unsigned firmware later in the job.
      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Authenticate to AWS (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Derive the firmware's OTA trust anchor from the live signing keys: fetch
      # each public half, verify it against its DER-SHA256 pin, then reduce it to
      # the Secure Boot v2 block-format digest the device matches per signature
      # block. The config reads these via !secret from secrets.yaml in the
      # config directory (the repo root); the file is gitignored.
      - name: Fetch signing keys and write the trust anchor (secrets.yaml)
        shell: bash
        run: |
          set -euo pipefail

          # GCP: fetch, pin-check, then derive the block-format digest.
          gcloud kms keys versions get-public-key "${KMS_KEY_VERSION}" \
            --project "${PROJECT_ID}" \
            --location "${KMS_LOCATION}" \
            --keyring "${KMS_KEYRING}" \
            --key "${KMS_KEY}" \
            --output-file gcp_pubkey.pem
          gcp_der=$(openssl pkey -pubin -in gcp_pubkey.pem -outform DER | sha256sum | cut -d' ' -f1)
          if [ "$gcp_der" != "${GCP_PUBKEY_DER_SHA256}" ]; then
            echo "GCP public key fingerprint mismatch — refusing to build a trust anchor from it" >&2
            echo "expected=${GCP_PUBKEY_DER_SHA256}" >&2
            echo "actual  =${gcp_der}" >&2
            exit 1
          fi

          # AWS: KMS returns base64 DER; the pin is the SHA-256 of those bytes.
          aws kms get-public-key --key-id "${AWS_KMS_KEY_ARN}" \
            --query PublicKey --output text | base64 -d > aws_pubkey.der
          aws_der=$(sha256sum aws_pubkey.der | cut -d' ' -f1)
          if [ "$aws_der" != "${AWS_PUBKEY_DER_SHA256}" ]; then
            echo "AWS public key fingerprint mismatch — refusing to build a trust anchor from it" >&2
            echo "expected=${AWS_PUBKEY_DER_SHA256}" >&2
            echo "actual  =${aws_der}" >&2
            exit 1
          fi
          openssl pkey -pubin -inform DER -in aws_pubkey.der -out aws_pubkey.pem

          # Block-format SHA-256 digest of each key's signature-block region.
          uvx --from esptool espsecure digest-sbv2-public-key \
            --keyfile gcp_pubkey.pem --output gcp_digest.bin
          uvx --from esptool espsecure digest-sbv2-public-key \
            --keyfile aws_pubkey.pem --output aws_digest.bin
          gcp_digest=$(od -An -v -tx1 gcp_digest.bin | tr -d ' \n')
          aws_digest=$(od -An -v -tx1 aws_digest.bin | tr -d ' \n')

          cat > secrets.yaml <<EOF_SECRETS
          fw_key_digest_gcp: "${gcp_digest}"
          fw_key_digest_aws: "${aws_digest}"
          EOF_SECRETS
          echo "Trust anchor: gcp=${gcp_digest} aws=${aws_digest}"

      - name: Build firmware
        shell: bash
        env:
          # Resolved by the config itself (!env_var): FW_VERSION stamps
          # esphome.project.version; FW_CHANNEL_MANIFEST picks the update
          # channel the firmware polls on firmware.nabucasa.com.
          FW_VERSION: ${{ steps.version.outputs.version }}
          FW_CHANNEL_MANIFEST: ${{ startsWith(github.ref, 'refs/tags/') && 'manifest.json' || 'manifest-staging.json' }}
        run: |
          set -euo pipefail

          echo "Building ${CONFIG} ${FW_VERSION} (${FW_CHANNEL_MANIFEST}) with ESPHome ${ESPHOME_VERSION}"
          uvx --from "esphome==${ESPHOME_VERSION}" esphome compile "${CONFIG}"

          # Retain this build's boot components (everything flasher_args.json
          # flashes except the app: bootloader, partition table, OTA data) so
          # the post-sign publisher can assemble the factory image around the
          # signed app. They must stay OUT of the signing prefix — they travel
          # as a commit-keyed Actions artifact instead.
          build_dir="$(ls -td .esphome/build/*/build 2>/dev/null | head -1)"
          fa="$build_dir/flasher_args.json"
          if [ ! -f "$fa" ]; then
            echo "flasher_args.json missing for ${CONFIG}" >&2
            exit 1
          fi
          mkdir -p "boot/${TARGET}"
          cp "$fa" "boot/${TARGET}/"

          # Harvest the signable app image: the sector-padded unsigned
          # OTA image ESPHome writes to the build directory.
          if [ ! -f "$build_dir/firmware.ota.bin" ]; then
            echo "firmware.ota.bin missing for ${CONFIG}" >&2
            exit 1
          fi
          mkdir -p "unsigned/${TARGET}"
          cp "$build_dir/firmware.ota.bin" "unsigned/${TARGET}/firmware.ota.bin"

          app_file="$(jq -r '.app.file' "$fa")"
          while IFS= read -r f; do
            [ "$f" = "$app_file" ] && continue
            mkdir -p "boot/${TARGET}/$(dirname "$f")"
            cp "$build_dir/$f" "boot/${TARGET}/$f"
          done < <(jq -r '.flash_files[]' "$fa")

      # ------------------------------------------------------------------
      # Firmware signing (staging) — stage the unsigned image together with
      # a v1 build-info.json manifest, the contract the signing dashboard
      # validates before a build may enter the approval queue.
      # ------------------------------------------------------------------
      - name: Stage unsigned firmware for signing
        shell: bash
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # The signable artifact is the sector-padded unsigned APP image
          # (built with CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES disabled):
          # Secure Boot v2 signing appends its signature block to this
          # image, and it is what OTA installs and verifies. The factory
          # image is a merged flash image (bootloader + partition table +
          # app) and is NOT directly signable — the signed factory image
          # is assembled around the signed app by publish-signed-firmware.yml.
          bin="unsigned/${TARGET}/firmware.ota.bin"
          if [ ! -f "$bin" ]; then
            echo "Missing harvested app image for ${TARGET}" >&2
            exit 1
          fi

          # firmware-unsigned.bin and build-info.json must be direct siblings
          # under <target-id>/<version>/<commit-sha>/, where <version> matches
          # the manifest's version (the dashboard cross-checks this).
          stage="upload/${TARGET}/${FW_VERSION}/${GITHUB_SHA}"
          mkdir -p "$stage"
          cp "$bin" "$stage/firmware-unsigned.bin"

          # Sanity checks: the staged image must be 4 KiB-aligned and must
          # not already carry a signature block.
          size=$(stat -c%s "$stage/firmware-unsigned.bin")
          if [ $(( size % 4096 )) -ne 0 ]; then
            echo "App image is not padded to a 4 KiB boundary (${size} bytes)" >&2
            exit 1
          fi
          # For an unsigned image espsecure prints "Signature block 0
          # absent/invalid" and exits 0 either way — match the marker,
          # don't rely on the exit status.
          sig_info="$(uvx --from esptool espsecure signature-info-v2 "$stage/firmware-unsigned.bin" 2>&1 || true)"
          if ! grep -qi "signature block 0 absent/invalid" <<<"$sig_info"; then
            echo "App image already contains a signature block (or the check failed):" >&2
            echo "$sig_info" >&2
            exit 1
          fi

          sha256=$(sha256sum "$stage/firmware-unsigned.bin" | cut -d' ' -f1)

          # Built with jq so values are always correctly JSON-escaped.
          jq -n \
            --argjson schema_version 1 \
            --arg product   "${TARGET}" \
            --arg version   "${FW_VERSION}" \
            --arg filename  "firmware-unsigned.bin" \
            --arg sha256    "${sha256}" \
            --argjson size_bytes "${size}" \
            --arg chip      "${CHIP}" \
            --arg scheme    "${SIGN_SCHEME}" \
            --arg repo      "${GITHUB_REPOSITORY}" \
            --arg ref       "${GITHUB_REF}" \
            --arg commit    "${GITHUB_SHA}" \
            --arg run_id    "${GITHUB_RUN_ID}" \
            --arg run_url   "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg actor     "${GITHUB_ACTOR}" \
            --arg built_at  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: $schema_version,
              product: $product,
              version: $version,
              artifact: {
                filename: $filename,
                sha256: $sha256,
                size_bytes: $size_bytes
              },
              target: {
                chip: $chip,
                secure_boot_scheme: $scheme
              },
              source: {
                repository: $repo,
                ref: $ref,
                commit: $commit,
                run_id: $run_id,
                run_url: $run_url,
                actor: $actor
              },
              built_at: $built_at
            }' > "$stage/build-info.json"

          echo "Manifest:" && cat "$stage/build-info.json"

      # The boot components are unsigned and non-secret; the post-sign
      # publisher fetches them by run id + commit to merge with the signed app.
      - name: Retain boot components for factory assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: boot-${{ github.sha }}
          path: boot/
          if-no-files-found: error

      - name: Upload to unsigned bucket
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a  # v3.0.0
        with:
          path: upload
          destination: ${{ env.BUCKET }}
          parent: false                # don't prefix with the local dir name
          gzip: false                  # dashboard hash-gates on exact object bytes
          process_gcloudignore: false

      - name: Signing upload summary
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Unsigned firmware uploaded (${FW_ENV})"
            echo ""
            echo "- \`gs://${BUCKET}/${TARGET}/${FW_VERSION}/${GITHUB_SHA}/\`"
            echo ""
            echo "Awaiting review & signature in the **${FW_ENV}** Autograph dashboard."
            echo ""
            echo "After approval, run **Publish signed firmware** with:"
            echo "- environment: \`${FW_ENV}\`"
            echo "- version: \`${FW_VERSION}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- boot_run_id: \`${GITHUB_RUN_ID}\`"
            if [ "${FW_ENV}" = "prod" ]; then
              echo "- channel: \`beta\` first, then \`production\` to promote"
              echo "- dispatched on the release tag: \`--ref ${GITHUB_REF_NAME}\` (prod WIF only mints tokens for tags)"
            else
              echo "- dispatched on \`--ref dev\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
