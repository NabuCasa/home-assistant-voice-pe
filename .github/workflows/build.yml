# Pull-request validation: compiles the factory config against a placeholder
# trust anchor so the !secret lookups resolve. Nothing built here is signed
# or published; see upload-unsigned-firmware.yml for the release path.

name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIG: home-assistant-voice.factory.yaml
  ESPHOME_VERSION: 2026.9.0

jobs:
  build:
    # Mirrors the check context the dev ruleset requires.
    name: Build Firmware / home-assistant-voice.factory.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Write placeholder trust anchor (secrets.yaml)
        run: |
          printf 'fw_key_digest_gcp: "%064d"\nfw_key_digest_aws: "%064d"\n' 0 1 > secrets.yaml

      - name: Compile firmware
        run: uvx --from "esphome==${ESPHOME_VERSION}" esphome compile "${CONFIG}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: home-assistant-voice
          path: .esphome/build/*/build/firmware*.bin
          if-no-files-found: warn
